server {
    server_tokens off;
    client_max_body_size 10M;

    location / {
        try_files $uri /index.html;
    }

    location ~^/(admin|api|docs|openapi.json) {
        proxy_set_header Host $host;
        proxy_pass http://backend:8000;
    }

    location /media/ {
        alias /media/;
    }
}
