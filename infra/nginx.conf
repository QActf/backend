server {
    server_tokens off;
    client_max_body_size 10M;

    location / {
        alias /frontend_static;
        try_files $uri /index.html;
    }

    location ~^/(admin|api) {
        proxy_set_header Host $host;
        proxy_pass http://backend:8000;
    }

    location ~^/(default_photo|photo_profile|default_icon|icon_course)/ {
        root /media/;
    }
}
